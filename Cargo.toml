[workspace]
members = ["backend/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Cle2ment/tdm"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
thiserror = "2.0.21"
async-trait = "0.1.92"
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl"] }
tracing = "0.1.44"
