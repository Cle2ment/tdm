[package]
name = "tdmm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TDM management CLI: config bootstrap, key management, doctor, audit queries, and single-shot judgment calls."

[[bin]]
name = "tdmm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tdm-core = { path = "../tdm-core" }
tdm-provider-jev = { path = "../tdm-provider-jev" }
tdm-provider-mock = { path = "../tdm-provider-mock" }
tdm-runtime = { path = "../tdm-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml_edit = "0.23"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
