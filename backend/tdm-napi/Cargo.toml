[package]
name = "tdm-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native (napi-rs) binding for the TDM decision runtime: npm package @typedecision/runtime."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"
serde.workspace = true
serde_json.workspace = true
tdm-core = { path = "../tdm-core" }
tdm-provider-jev = { path = "../tdm-provider-jev" }
tdm-provider-mock = { path = "../tdm-provider-mock" }
tdm-runtime = { path = "../tdm-runtime" }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "time",
] }

[dev-dependencies]
tempfile = "3"
