name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      # tdm-napi's lib-test binary needs napi symbols from the Node runtime;
      # they don't exist on Linux outside Node, so its unit tests run on
      # Windows (MSVC links fine) and the napi job covers real .node loading.
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --exclude tdm-napi
          else
            cargo test --workspace
          fi

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm -r --if-present test

  napi:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @typedecision/runtime build:debug
      - run: pnpm --filter @typedecision/runtime smoke
      - if: matrix.os != 'macos-latest'
        uses: oven-sh/setup-bun@v2
      - if: matrix.os != 'macos-latest'
        run: pnpm --filter @typedecision/runtime smoke:bun
